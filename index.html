<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="根据新秀杯数学建模 A 题规则制作的可交互塔防游戏"
    />
    <title>守关 塔防布局挑战</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-column" aria-label="游戏地图">
        <header class="game-header">
          <div>
            <p class="eyebrow">数学建模交互实验</p>
            <h1>守关</h1>
            <p>塔防游戏中的防御布局与资源调度</p>
          </div>
          <div class="header-badge">A题可玩版</div>
        </header>

        <div class="canvas-frame">
          <canvas
            id="game-canvas"
            width="2000"
            height="2000"
            aria-label="塔防游戏地图。点击地图建塔，点击已有塔进行选择。"
          ></canvas>
          <div id="canvas-message" class="canvas-message" aria-live="polite"></div>
        </div>
      </section>

      <aside class="control-panel" aria-label="游戏控制面板">
        <section class="panel-section">
          <h2>游戏模式</h2>
          <div class="segmented-control" role="group" aria-label="选择游戏模式">
            <button class="mode-button" data-mode="q1" type="button">
              问题1 开局布塔
            </button>
            <button class="mode-button active" data-mode="q2" type="button">
              问题2 动态调度
            </button>
          </div>
          <p id="mode-description" class="section-note"></p>
        </section>

        <section class="panel-section">
          <h2>战局</h2>
          <div class="stats-grid">
            <div class="stat-card"><span>资金</span><strong id="funds-stat">2000</strong></div>
            <div class="stat-card"><span>时间</span><strong id="time-stat">0.0 s</strong></div>
            <div class="stat-card"><span>击杀</span><strong id="kills-stat">0</strong></div>
            <div class="stat-card"><span>漏怪</span><strong id="leaks-stat">0</strong></div>
          </div>
          <p id="detail-stat" class="detail-stat"></p>
        </section>

        <section class="action-row" aria-label="游戏操作">
          <button id="start-button" class="primary-button" type="button">开始 Space</button>
          <button id="speed-button" class="secondary-button" type="button">速度 1× F</button>
          <button id="restart-button" class="secondary-button" type="button">重开 R</button>
          <button id="preset-button" class="secondary-button" type="button">
            载入问题1优化方案 P
          </button>
        </section>

        <p id="status-message" class="status-message" aria-live="polite">
          先选择塔型并点击地图建塔，然后开始战斗。
        </p>

        <section class="panel-section">
          <h2>选择防御塔</h2>
          <div class="tower-options">
            <button class="tower-button active" data-kind="small" type="button">
              <span class="tower-key">1</span>
              <span><strong>小型塔</strong><small>￥100　75m　DPS 10</small></span>
            </button>
            <button class="tower-button" data-kind="medium" type="button">
              <span class="tower-key">2</span>
              <span><strong>中型塔</strong><small>￥250　125m　DPS 20</small></span>
            </button>
            <button class="tower-button" data-kind="large" type="button">
              <span class="tower-key">3</span>
              <span><strong>大型塔</strong><small>￥600　200m　DPS 40</small></span>
            </button>
          </div>
        </section>

        <section class="panel-section selected-section">
          <h2>当前选择</h2>
          <p id="selected-info">待建：小型塔</p>
          <button id="upgrade-button" class="secondary-button" type="button">
            升级选中塔 U
          </button>
        </section>

        <details class="help-panel">
          <summary>操作和规则</summary>
          <ul>
            <li>鼠标或触控点击地图建塔；点击已有塔可选择。</li>
            <li>数字键 1、2、3 切换塔型，U 升级。</li>
            <li>Space 开始或暂停，F 加速，R 重新开始。</li>
            <li>P 或“载入问题1优化方案”可自动放置8座中型塔并复现实验。</li>
            <li>浅红色区域是塔心禁入区，任意两座塔的塔基不能重叠。</li>
            <li>问题1开始后不能继续建塔；问题2战斗中可以随时建设和升级。</li>
          </ul>
        </details>
      </aside>
    </main>
    <script src="game.js"></script>
  </body>
</html>
